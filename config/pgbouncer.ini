;; =========================================================================
;; PgBouncer Production Configuration: High-Concurrency Transaction Pooling
;; Used by District / BookMyShow class systems to multiplex 10,000+ incoming
;; client connections into a tight pool of 20 to 50 physical PostgreSQL connections.
;; =========================================================================

[databases]
;; Direct connection multiplexer to PostgreSQL master
happenins_db = host=127.0.0.1 port=5432 dbname=happenins_db pool_mode=transaction

;; Fallback / Wildcard for any database name
* = host=127.0.0.1 port=5432 pool_mode=transaction

[pgbouncer]
;; IP and Port to listen on
listen_addr = 0.0.0.0
listen_port = 6432

;; Authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; =========================================================================
;; Pillar 4: Connection Multiplexing & Pool Sizing
;; =========================================================================
;; In standard Node.js setups, 50 Express server pods with 20 connections each = 1,000 connections,
;; crashing PostgreSQL.
;; In transaction pooling mode:
;; A connection is only assigned to a query for the few milliseconds it executes, then immediately returned.
pool_mode = transaction

;; Max client connections allowed from all Express server pods combined
max_client_conn = 10000

;; Physical connection pool to PostgreSQL per database/user pair
;; 20 to 50 physical connections comfortably handle 10,000 active checkout users
default_pool_size = 25

;; Minimum connections to keep warm
min_pool_size = 5

;; Emergency reserve pool for sudden bursts
reserve_pool_size = 5
reserve_pool_timeout = 5.0

;; Hard ceiling on total physical connections across all databases
max_db_connections = 50

;; =========================================================================
;; Pillar 4: Strict Statement & Query Timeouts
;; =========================================================================
;; Kill any long-running query before it starves other transactions
query_timeout = 3.0
statement_timeout = 3000

;; Max time a client query can wait in pool queue before timing out (fast failure)
query_wait_timeout = 10.0

;; Timeouts for server lifecycle
server_idle_timeout = 60.0
server_connect_timeout = 5.0
server_login_retry = 1.0
client_idle_timeout = 300.0

;; =========================================================================
;; Transaction Pooling Compatibility Options
;; =========================================================================
;; Allows clean connection cleanup when transactions finish
server_reset_query = DISCARD ALL
server_check_delay = 30.0
server_check_query = SELECT 1

;; Logging & Diagnostics
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
